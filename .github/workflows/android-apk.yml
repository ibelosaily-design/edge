name: android-apk

# Builds an installable Android APK of our fork on every push to the
# `elosaily` branch (and on demand). No secrets needed: without a release
# keystore the build falls back to debug signing, and without
# google-services.json the Firebase plugins are not applied at all, so the
# app runs fully local with no telemetry.

on:
  push:
    branches: [elosaily]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # only to stash the APK on a private DRAFT release
    env:
      # Secrets cannot be used in `if:` directly; surface their presence here.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'   # pinned: the version upstream CI builds with
          cache: true

      - name: Write .env (fully local build, no cloud endpoints)
        run: |
          echo "COMPANION_URL=" > .env
          echo "BACKEND_URL=" >> .env

      - run: flutter pub get

      # Release signing when the four ANDROID_* secrets are set on the repo
      # (Settings → Secrets → Actions); otherwise the build falls back to
      # debug signing, which installs fine but cannot update over a
      # release-signed install (and vice versa).
      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK (no Firebase)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Gradle treats ANY value of ANDROID_KEYSTORE_PATH (even "") as
          # "sign for release", so the variable is only exported when the
          # keystore really exists.
          if [ "$HAS_KEYSTORE" = "true" ]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            echo "Signing: release key"
          else
            echo "Signing: debug fallback (no ANDROID_KEYSTORE_BASE64 secret)"
          fi
          flutter build apk --release --dart-define-from-file=.env

      - name: Name the APK
        run: |
          mkdir -p dist
          ver=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          cp build/app/outputs/flutter-apk/app-release.apk "dist/elosaily-strap-${ver}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: elosaily-strap-apk
          path: dist/*.apk
          retention-days: 30

      # Also stash the APK on a private DRAFT release (drafts are visible only
      # to repo collaborators, never on the public Releases page). Artifacts
      # can only be fetched through a browser login; a draft asset can be
      # pulled with the API, which is how the file reaches the chat.
      - name: Stash APK on a private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" --draft --title "CI build #${{ github.run_number }}" \
            --notes "Automated build of ${{ github.sha }} (branch elosaily). Draft: not public." \
            dist/*.apk
