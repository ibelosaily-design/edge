name: android-apk

# Builds an installable Android APK of our fork on every push to the
# `elosaily` branch (and on demand). No secrets needed: without a release
# keystore the build falls back to debug signing, and without
# google-services.json the Firebase plugins are not applied at all, so the
# app runs fully local with no telemetry.

on:
  push:
    branches: [elosaily]
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK on a GitHub Release

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'   # pinned: the version upstream CI builds with
          cache: true

      - name: Write .env (fully local build, no cloud endpoints)
        run: |
          echo "COMPANION_URL=" > .env
          echo "BACKEND_URL=" >> .env

      - run: flutter pub get

      - name: Build release APK (debug-signed, no Firebase)
        run: flutter build apk --release --dart-define-from-file=.env

      - name: Name the APK
        run: |
          mkdir -p dist
          ver=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          cp build/app/outputs/flutter-apk/app-release.apk "dist/elosaily-strap-${ver}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: elosaily-strap-apk
          path: dist/*.apk
          retention-days: 30

      # Publish the same APK on a rolling pre-release so it can be downloaded
      # directly on a phone from the Releases page, no GitHub login needed.
      - name: Publish rolling pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: elosaily-latest
          name: Elosaily Strap (latest build)
          prerelease: true
          files: dist/*.apk
          body: |
            Debug-signed APK built automatically from branch `elosaily`
            (commit ${{ github.sha }}). Install on Android 8+; allow
            "install from unknown sources" when prompted.
